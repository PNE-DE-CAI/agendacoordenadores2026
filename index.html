<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda do Coordenador · SEDUC SP 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0a2f6c 0%, #041a3a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1e293b;
        }

        .main-container {
            max-width: 1440px;
            margin: 0 auto;
            background: #0f1a24;
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 30px 35px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,255,200,0.1);
            border: 1px solid #d32f2f;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 47, 108, 0.85);
            backdrop-filter: blur(4px);
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo-area img {
            height: 55px;
            width: auto;
            border-radius: 12px;
            background: white;
            padding: 4px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1rem;
            font-weight: 600;
            color: #ffec9e;
            line-height: 1.3;
        }

        .logo-text small {
            display: block;
            font-weight: 400;
            font-size: 0.75rem;
            color: rgba(255,236,158,0.6);
        }

        .title-badge {
            background: #d32f2f;
            color: white;
            padding: 6px 18px;
            border-radius: 3rem;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .nav-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 24px;
            padding: 0 6px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
        }

        .nav-btn:hover {
            background: rgba(211, 47, 47, 0.25);
            color: #fff;
            border-color: #d32f2f;
        }

        .nav-btn.active {
            background: #d32f2f;
            color: #fff;
            border-color: #d32f2f;
            box-shadow: 0 4px 15px rgba(211,47,47,0.4);
        }

        .app {
            display: block;
            padding: 0 4px 8px;
        }

        .card {
            background: white;
            border-radius: 32px;
            padding: 1.8rem 2rem;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 1px solid #e0e4e9;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.25);
        }

        .card h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0a2f6c;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 16px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #0a2f6c;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px 14px;
            border: 1.5px solid #dce1e8;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: 0.2s;
            background: #fafcff;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #0a2f6c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(10, 47, 108, 0.15);
            background: white;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            background: #f8faff;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            font-size: 0.9rem;
            color: #1e293b;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #d32f2f;
            margin: 0;
            cursor: pointer;
        }

        .custom-acao {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .custom-acao input {
            flex: 1;
            min-width: 120px;
        }

        .btn {
            padding: 11px 28px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: #d32f2f;
            color: white;
        }

        .btn-primary:hover {
            background: #b71c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(211,47,47,0.35);
        }

        .btn-secondary {
            background: #0a2f6c;
            color: white;
        }

        .btn-secondary:hover {
            background: #041a3a;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #d32f2f;
            color: #d32f2f;
        }

        .btn-outline:hover {
            background: #d32f2f;
            color: white;
        }

        .btn-success {
            background: #0a7e3e;
            color: white;
        }

        .btn-success:hover {
            background: #065f2e;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #eef2f6;
            color: #991b1b;
        }

        .btn-danger:hover {
            background: #fde8e8;
            color: #7f1d1d;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 14px 8px 10px 8px;
            font-weight: 700;
            color: #0a2f6c;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        td {
            padding: 14px 8px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8faff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-concluido {
            background: #dcfce7;
            color: #166534;
        }

        .status-pendente {
            background: #fee2e2;
            color: #991b1b;
        }

        .acao-tag {
            background: #e6edf6;
            color: #0a2f6c;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
            display: inline-block;
            margin: 2px 3px 2px 0;
            white-space: nowrap;
        }

        .td-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .td-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.1s;
        }

        .td-actions .btn-edit:hover {
            background: #dbeafe;
            color: #1e40af;
        }

        .td-actions .btn-delete:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .td-actions .btn-toggle:hover {
            background: #dcfce7;
            color: #166534;
        }

        .empty-message {
            text-align: center;
            padding: 40px 10px;
            color: #64748b;
            font-style: italic;
        }

        .observacao-cell {
            max-width: 180px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.85rem;
            color: #475569;
        }

        .page-footer {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,236,158,0.35);
            margin-top: 30px;
            padding: 10px 0 6px;
            font-weight: 400;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 960px) {
            .main-container { border-radius: 28px; padding: 14px; }
            .header { border-radius: 32px; flex-wrap: wrap; }
            .card { padding: 1.5rem; }
        }

        @media (max-width: 500px) {
            body { padding: 10px; }
            .main-container { border-radius: 20px; padding: 10px; }
            .header { border-radius: 24px; padding: 10px 16px; flex-direction: column; align-items: flex-start; }
            .logo-area img { height: 40px; }
            .card { padding: 1.2rem; border-radius: 20px; }
            .grid-2 { grid-template-columns: 1fr; }
            .nav-btn { padding: 8px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- CABEÇALHO INSTITUCIONAL -->
    <div class="header">
        <div class="logo-area">
            <img src="https://i.ibb.co/0p01LzxB/logo3de.jpg" alt="Logo Seduc SP">
            <div class="logo-text">
                Calendário Pedagógico 2026
                <small>Secretaria da Educação — São Paulo</small>
            </div>
        </div>
        <span class="title-badge">COORDENADOR</span>
    </div>

    <!-- NAVEGAÇÃO POR ABAS (Filtros) -->
    <nav class="nav-bar" role="navigation">
        <button class="nav-btn active" data-filter="all">📋 Todos</button>
        <button class="nav-btn" data-filter="pendente">⏳ Pendentes</button>
        <button class="nav-btn" data-filter="concluido">✅ Concluídos</button>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="app">

        <!-- FORMULÁRIO -->
        <div class="card">
            <h2>✏️ Novo Registro / Edição</h2>
            <form id="agendaForm" autocomplete="off">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="escola">🏫 Escola <span style="color:#b91c1c;">*</span></label>
                        <input type="text" id="escola" placeholder="Nome da escola" required>
                    </div>
                    <div class="form-group">
                        <label for="coordenador">👤 Coordenador <span style="color:#b91c1c;">*</span></label>
                        <input type="text" id="coordenador" placeholder="Nome do coordenador" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="data">📅 Data <span style="color:#b91c1c;">*</span></label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label for="pauta">📌 Pauta / Tema <span style="color:#b91c1c;">*</span></label>
                        <input type="text" id="pauta" placeholder="Ex: Alinhamento do Projeto de Vida" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventos">🗓️ Eventos / Datas Importantes</label>
                    <input type="text" id="eventos" placeholder="Ex: Conselho de Classe, Reunião de Pais, Entrega de Notas">
                </div>

                <div class="form-group">
                    <label>🧑‍🏫 Ações Formativas (marque as que se aplicam)</label>
                    <div class="checkbox-group" id="acoesContainer">
                        <label><input type="checkbox" value="Multiplica SP"> Multiplica SP</label>
                        <label><input type="checkbox" value="Jornada Formativa"> Jornada Formativa</label>
                        <label><input type="checkbox" value="ATPCO"> ATPCO</label>
                        <label><input type="checkbox" value="Currículo Paulista"> Currículo Paulista</label>
                        <label><input type="checkbox" value="Projeto de Vida"> Projeto de Vida</label>
                        <label><input type="checkbox" value="Eletivas"> Eletivas</label>
                        <label><input type="checkbox" value="Reunião de Pais"> Reunião de Pais</label>
                        <label><input type="checkbox" value="Conselho de Classe"> Conselho de Classe</label>
                        <div class="custom-acao">
                            <label><input type="checkbox" id="outraAcaoCheck" value="outra"> Outra:</label>
                            <input type="text" id="outraAcaoInput" placeholder="Digite a ação..." disabled>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="observacao">📝 Observações / Encaminhamentos</label>
                    <textarea id="observacao" placeholder="Detalhes importantes, pendências, próximos passos..." rows="3"></textarea>
                </div>

                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: #0a2f6c; cursor: pointer;">
                        <input type="checkbox" id="concluido" style="width:20px; height:20px; accent-color:#0a7e3e;">
                        ✅ Marcar como Concluído
                    </label>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button type="submit" class="btn btn-primary" id="submitBtn">➕ Adicionar / Salvar</button>
                        <button type="reset" class="btn btn-outline" id="cancelEditBtn" style="display:none;">✖ Cancelar Edição</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- LISTA DE REGISTROS -->
        <div class="card">
            <h2>📂 Histórico da Agenda</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Pauta</th>
                            <th>Eventos</th>
                            <th>Ações</th>
                            <th>Observação</th>
                            <th>Status</th>
                            <th style="min-width:110px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="agendaTableBody">
                        <tr><td colspan="7" class="empty-message">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="page-footer">
            Agenda do Coordenador Pedagógico · SEDUC SP 2026 · Dados salvos no URE-CAIEIRAS
        </div>
    </div>
</div>

<script>
    // ==================== CONFIGURAÇÃO DO FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDgBqjOt4v1w8aoFE98pzUjgFocqwFHOds",
        authDomain: "isaurafaroldinamico.firebaseapp.com",
        projectId: "isaurafaroldinamico",
        storageBucket: "isaurafaroldinamico.firebasestorage.app",
        messagingSenderId: "573527283005",
        appId: "1:573527283005:web:cba9c9628c0ba06d31a154",
        measurementId: "G-4Y8V485Y24"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==================== APLICAÇÃO ====================
    document.addEventListener('DOMContentLoaded', () => {

        // Elementos do DOM
        const form = document.getElementById('agendaForm');
        const escolaInput = document.getElementById('escola');
        const coordenadorInput = document.getElementById('coordenador');
        const dataInput = document.getElementById('data');
        const pautaInput = document.getElementById('pauta');
        const eventosInput = document.getElementById('eventos');
        const observacaoInput = document.getElementById('observacao');
        const concluidoCheck = document.getElementById('concluido');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelEditBtn');
        const tbody = document.getElementById('agendaTableBody');

        const outraCheck = document.getElementById('outraAcaoCheck');
        const outraInput = document.getElementById('outraAcaoInput');

        // Filtros
        const filterButtons = document.querySelectorAll('.nav-btn[data-filter]');
        let currentFilter = 'all';

        // Estado
        let editingId = null;

        // ========== FUNÇÕES DE CRUD ==========

        // Salvar (adicionar ou atualizar)
        function saveItem(data) {
            const id = editingId;
            if (id) {
                db.collection('agendaCoordenadorSP').doc(id).update(data)
                    .then(() => {
                        resetForm();
                    })
                    .catch(err => alert('Erro ao atualizar: ' + err.message));
            } else {
                db.collection('agendaCoordenadorSP').add(data)
                    .then(() => {
                        resetForm();
                    })
                    .catch(err => alert('Erro ao adicionar: ' + err.message));
            }
        }

        // Excluir
        function deleteItem(id) {
            if (confirm('Tem certeza que deseja excluir este registro?')) {
                db.collection('agendaCoordenadorSP').doc(id).delete()
                    .catch(err => alert('Erro ao excluir: ' + err.message));
            }
        }

        // Alternar status
        function toggleStatus(id, currentStatus) {
            db.collection('agendaCoordenadorSP').doc(id).update({
                concluido: !currentStatus
            }).catch(err => alert('Erro ao alternar status: ' + err.message));
        }

        // ========== RENDERIZAÇÃO ==========

        function renderItems(items) {
            let filtered = [...items];
            if (currentFilter === 'pendente') {
                filtered = filtered.filter(i => !i.concluido);
            } else if (currentFilter === 'concluido') {
                filtered = filtered.filter(i => i.concluido);
            }

            if (filtered.length === 0) {
                let msg = 'Nenhum registro encontrado.';
                if (currentFilter === 'pendente') msg = '🎉 Todos os registros estão concluídos!';
                else if (currentFilter === 'concluido') msg = 'Nenhum registro concluído ainda.';
                tbody.innerHTML = `<tr><td colspan="7" class="empty-message">${msg}</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const statusClass = item.concluido ? 'status-concluido' : 'status-pendente';
                const statusText = item.concluido ? '✅ Concluído' : '⏳ Pendente';

                const acoesHtml = (item.acoes && item.acoes.length > 0) ?
                    item.acoes.map(a => `<span class="acao-tag">${a}</span>`).join('') :
                    '<span style="color:#94a3b8;font-size:0.8rem;">—</span>';

                html += `
                    <tr>
                        <td><strong>${formatDate(item.data)}</strong></td>
                        <td><strong>${item.pauta}</strong></td>
                        <td>${item.eventos || '—'}</td>
                        <td>${acoesHtml}</td>
                        <td class="observacao-cell">${item.observacao || '—'}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <div class="td-actions">
                                <button class="btn-edit" title="Editar" data-id="${item.id}">✏️</button>
                                <button class="btn-toggle" title="Alternar Status" data-id="${item.id}" data-status="${item.concluido}">🔄</button>
                                <button class="btn-delete" title="Excluir" data-id="${item.id}">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;

            // Eventos dos botões
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    deleteItem(btn.dataset.id);
                });
            });

            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const item = items.find(i => i.id === id);
                    if (item) fillFormForEdit(item);
                });
            });

            document.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const current = btn.dataset.status === 'true';
                    toggleStatus(id, current);
                });
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const partes = dateStr.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return dateStr;
        }

        // ========== FORMULÁRIO ==========

        function getSelectedAcoes() {
            const acoes = [];
            document.querySelectorAll('#acoesContainer input[type="checkbox"]:checked').forEach(cb => {
                if (cb.id === 'outraAcaoCheck') {
                    const val = outraInput.value.trim();
                    if (val) acoes.push(`Outra: ${val}`);
                } else {
                    acoes.push(cb.value);
                }
            });
            return acoes;
        }

        function resetForm() {
            form.reset();
            editingId = null;
            submitBtn.textContent = '➕ Adicionar / Salvar';
            cancelBtn.style.display = 'none';
            outraInput.disabled = true;
            outraInput.value = '';
            outraCheck.checked = false;
            const hoje = new Date().toISOString().split('T')[0];
            dataInput.value = hoje;
        }

        function fillFormForEdit(item) {
            editingId = item.id;
            escolaInput.value = item.escola || '';
            coordenadorInput.value = item.coordenador || '';
            dataInput.value = item.data;
            pautaInput.value = item.pauta;
            eventosInput.value = item.eventos || '';
            observacaoInput.value = item.observacao || '';
            concluidoCheck.checked = item.concluido || false;

            document.querySelectorAll('#acoesContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
            outraInput.value = '';
            outraInput.disabled = true;

            if (item.acoes && Array.isArray(item.acoes)) {
                item.acoes.forEach(acao => {
                    if (acao.startsWith('Outra:')) {
                        const val = acao.replace('Outra:', '').trim();
                        outraCheck.checked = true;
                        outraInput.disabled = false;
                        outraInput.value = val;
                    } else {
                        const cb = document.querySelector(`#acoesContainer input[type="checkbox"][value="${acao}"]`);
                        if (cb) cb.checked = true;
                    }
                });
            }

            submitBtn.textContent = '💾 Atualizar Registro';
            cancelBtn.style.display = 'inline-flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Submissão
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const escola = escolaInput.value.trim();
            const coordenador = coordenadorInput.value.trim();
            const data = dataInput.value;
            const pauta = pautaInput.value.trim();
            const eventos = eventosInput.value.trim();
            const observacao = observacaoInput.value.trim();
            const concluido = concluidoCheck.checked;
            const acoes = getSelectedAcoes();

            if (!escola) { alert('Por favor, informe o nome da escola.'); return; }
            if (!coordenador) { alert('Por favor, informe o nome do coordenador.'); return; }
            if (!data) { alert('Selecione uma data.'); return; }
            if (!pauta) { alert('Preencha a pauta.'); return; }

            const obj = {
                escola,
                coordenador,
                data,
                pauta,
                eventos: eventos || '',
                acoes: acoes || [],
                observacao: observacao || '',
                concluido,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            saveItem(obj);
        });

        cancelBtn.addEventListener('click', resetForm);

        // "Outra" checkbox
        outraCheck.addEventListener('change', function() {
            outraInput.disabled = !this.checked;
            if (!this.checked) outraInput.value = '';
            if (this.checked) outraInput.focus();
        });

        // Filtros
        filterButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                filterButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                if (window.allItems) {
                    renderItems(window.allItems);
                }
            });
        });

        // Inicialização: escuta em tempo real
        let allItems = [];
        db.collection('agendaCoordenadorSP')
            .orderBy('data', 'desc')
            .onSnapshot((snapshot) => {
                allItems = [];
                snapshot.forEach(doc => {
                    allItems.push({ id: doc.id, ...doc.data() });
                });
                window.allItems = allItems;
                renderItems(allItems);
            }, (error) => {
                console.error('Erro no snapshot:', error);
                tbody.innerHTML = `<tr><td colspan="7" class="empty-message">Erro ao carregar dados: ${error.message}</td></tr>`;
            });

        // Data padrão
        const hoje = new Date().toISOString().split('T')[0];
        dataInput.value = hoje;
    });
</script>
</body>
</html>
